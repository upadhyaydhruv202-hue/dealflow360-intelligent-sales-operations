name: hackathon-starter-kit

# App services. Data stores live in ./infra/docker-compose.yml (included below).
# Do not run infra/docker-compose.yml alone.

include:
  - path: ./infra/docker-compose.yml

services:
  # REQUIRED — Express API. Does not consume jobs (JOBS_PROCESS=false).
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    image: hackathon-backend:dev
    container_name: hackathon-backend
    init: true
    stop_grace_period: 15s
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hackathon}
      REDIS_URL: redis://redis:6379
      # `environment` wins over env_file. Empty JWT_* in `.env` would otherwise blank .env.example.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-access-secret-change-me-32b}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-change-me-32}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:-local-dev-storage-signing-secret-change-me}
      SEED_ON_START: ${SEED_ON_START:-true}
      STORAGE_LOCAL_DIR: storage
      JOBS_PROCESS: 'false'
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '/app/infra/docker/http-healthcheck.cjs', 'http://127.0.0.1:5000/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

  # REQUIRED — BullMQ consumer. Same image as backend; command is worker.
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    image: hackathon-backend:dev
    container_name: hackathon-worker
    init: true
    stop_grace_period: 15s
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hackathon}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-access-secret-change-me-32b}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-change-me-32}
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET:-local-dev-storage-signing-secret-change-me}
      STORAGE_LOCAL_DIR: storage
      JOBS_PROCESS: 'true'
    command: ['worker']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '/app/infra/docker/redis-healthcheck.cjs']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    restart: unless-stopped

  # REQUIRED — static SPA (frontend Dockerfile production stage).
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    image: hackathon-frontend:dev
    container_name: hackathon-frontend
    ports:
      - '5173:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/ >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped

  # OPTIONAL — unified reverse proxy on :8080. Not started unless profile nginx.
  # When using this profile, set TRUST_PROXY=1 so req.ip uses X-Forwarded-For from nginx.
  # Do not set TRUST_PROXY when publishing the API port directly.
  nginx:
    profiles: ['nginx']
    image: nginxinc/nginx-unprivileged:1.31-alpine
    container_name: hackathon-nginx
    ports:
      - '8080:8080'
    volumes:
      - ./infra/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    restart: unless-stopped
